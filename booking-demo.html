<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PeakFlow AI | Booking Demo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #070b16;
      color: white;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .brand {
      text-align: center;
      margin-bottom: 35px;
    }

    .brand h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .brand h1 span {
      color: #38bdf8;
    }

    .brand p {
      color: #94a3b8;
      font-size: 18px;
    }

    .card {
      background: #111827;
      border: 1px solid #26344d;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    .card h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1220;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #38bdf8;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #06111f;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-1px);
      background: #67d3ff;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .confirmation {
      display: none;
      margin-top: 25px;
      padding: 22px;
      border-radius: 14px;
      background: #0c2a25;
      border: 1px solid #1f806f;
    }

    .confirmation h3 {
      color: #5eead4;
      margin-bottom: 12px;
      font-size: 22px;
    }

    .confirmation p {
      color: #d1fae5;
      line-height: 1.7;
    }

    .reset {
      background: transparent;
      border: 1px solid #334155;
      color: #cbd5e1;
      margin-top: 12px;
    }

    .reset:hover {
      background: #1e293b;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .card {
        padding: 22px;
      }

      .brand h1 {
        font-size: 34px;
      }

      .card h2 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      <h1>PeakFlow<span>AI</span></h1>
      <p>Smart appointment automation demo</p>
    </div>

    <div class="card">

      <h2>Book an Appointment</h2>
      <p class="subtitle">
        Choose a service and a time that works for you.
      </p>

      <form id="bookingForm">

        <div class="form-group">
          <label for="name">Your Name</label>
          <input
            id="name"
            type="text"
            placeholder="John Smith"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            placeholder="john@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="service">Service</label>
          <select id="service" required>
            <option value="">Choose a service</option>
            <option value="Consultation">Consultation — $75</option>
            <option value="Strategy Session">Strategy Session — $125</option>
            <option value="Business Automation">Business Automation — $250</option>
            <option value="Follow-up Meeting">Follow-up Meeting — $50</option>
          </select>
        </div>

        <div class="row">

          <div class="form-group">
            <label for="date">Preferred Date</label>
            <input id="date" type="date" required>
          </div>

          <div class="form-group">
            <label for="time">Preferred Time</label>
            <select id="time" required>
              <option value="">Choose a time</option>
              <option>9:00 AM</option>
              <option>10:00 AM</option>
              <option>11:00 AM</option>
              <option>1:00 PM</option>
              <option>2:00 PM</option>
              <option>3:00 PM</option>
              <option>4:00 PM</option>
            </select>
          </div>

        </div>

        <button type="submit">
          Book Appointment
        </button>

      </form>

      <div class="confirmation" id="confirmation">

        <h3>✓ Appointment Request Received</h3>

        <p>
          Thanks, <strong id="confirmName"></strong>!
          Your <strong id="confirmService"></strong> is requested for
          <strong id="confirmDate"></strong> at
          <strong id="confirmTime"></strong>.
        </p>

        <p style="margin-top: 10px;">
          A confirmation will be sent to
          <strong id="confirmEmail"></strong>.
        </p>

        <button class="reset" onclick="resetBooking()">
          Make Another Booking
        </button>

      </div>

    </div>
  </div>

  <script>

    // Prevent customers from selecting a date in the past
    const dateInput = document.getElementById("date");

    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");

    dateInput.min = `${year}-${month}-${day}`;


    // Handle booking
    document
      .getElementById("bookingForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const name =
          document.getElementById("name").value;

        const email =
          document.getElementById("email").value;

        const service =
          document.getElementById("service").value;

        const date =
          document.getElementById("date").value;

        const time =
          document.getElementById("time").value;


        // Put information into confirmation
        document.getElementById("confirmName").textContent = name;

        document.getElementById("confirmEmail").textContent = email;

        document.getElementById("confirmService").textContent = service;

        document.getElementById("confirmTime").textContent = time;


        // Format date nicely
        const formattedDate =
          new Date(date + "T00:00:00")
            .toLocaleDateString("en-US", {
              weekday: "long",
              month: "long",
              day: "numeric",
              year: "numeric"
            });

        document.getElementById("confirmDate").textContent =
          formattedDate;


        // Hide form and show confirmation
        document.getElementById("bookingForm").style.display = "none";

        document.getElementById("confirmation").style.display = "block";

      });


    // Reset booking
    function resetBooking() {

      document.getElementById("bookingForm").reset();

      document.getElementById("bookingForm").style.display = "block";

      document.getElementById("confirmation").style.display = "none";

    }

  </script>

</body>
</html>
