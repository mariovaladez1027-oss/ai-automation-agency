<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PeakFlow AI | Booking Demo</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080d19;
            color: white;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #38bdf8;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 35px;
        }

        .booking-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 30px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            margin-top: 20px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 14px;

            background: #080d19;
            color: white;

            border: 1px solid #334155;
            border-radius: 8px;

            font-size: 16px;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 15px;

            background: #38bdf8;
            color: #06111d;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #confirmation {
            display: none;

            margin-top: 25px;

            padding: 20px;

            background: #0b3b2e;

            border: 1px solid #10b981;

            border-radius: 10px;
        }

    </style>
</head>


<body>

    <div class="container">

        <div class="logo">
            PeakFlow<span>AI</span>
        </div>

        <p class="subtitle">
            AI Appointment Booking Demo
        </p>


        <div class="booking-box">

            <h1>
                Book an Appointment
            </h1>

            <p class="description">
                Choose a service and a time that works for you.
            </p>


            <form id="bookingForm">

                <label for="name">
                    Your Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="John Smith"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="john@example.com"
                    required
                >


                <label for="service">
                    Choose a Service
                </label>

                <select id="service" required>

                    <option value="">
                        Select a service
                    </option>

                    <option>
                        Consultation
                    </option>

                    <option>
                        Appointment
                    </option>

                    <option>
                        Follow-Up
                    </option>

                </select>


                <label for="date">
                    Choose a Date
                </label>

                <input
                    type="date"
                    id="date"
                    required
                >


                <label for="time">
                    Choose a Time
                </label>

                <select id="time" required>

                    <option value="">
                        Select a time
                    </option>

                    <option>
                        9:00 AM
                    </option>

                    <option>
                        10:00 AM
                    </option>

                    <option>
                        11:00 AM
                    </option>

                    <option>
                        1:00 PM
                    </option>

                    <option>
                        2:00 PM
                    </option>

                    <option>
                        3:00 PM
                    </option>

                    <option>
                        4:00 PM
                    </option>

                </select>


                <button type="submit">
                    Book Appointment
                </button>

            </form>


            <div id="confirmation">

                <h3>
                    Appointment Request Received! ✅
                </h3>

                <p>
                    Thanks! Your appointment request has been recorded
                    in this demo.
                </p>

            </div>

        </div>

    </div>


    <script>

        const form = document.getElementById("bookingForm");

        const confirmation =
            document.getElementById("confirmation");


        form.addEventListener("submit", function(event) {

            event.preventDefault();

            confirmation.style.display = "block";

            form.style.display = "none";

        });

    </script>

</body>

</html>
