<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeakFlow AI | Booking Demo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #070d19;
      color: white;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .logo span {
      color: #38bdf8;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 16px;
    }

    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .description {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      border-radius: 9px;
      border: 1px solid #334155;
      background: #0b1324;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }

    select option {
      background: #0f172a;
      color: white;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: 9px;
      background: #38bdf8;
      color: #06111f;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .confirmation {
      display: none;
      text-align: center;
      padding: 30px 10px;
    }

    .confirmation-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .confirmation h2 {
      margin-bottom: 10px;
    }

    .confirmation p {
      color: #94a3b8;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      body {
        padding: 25px 15px;
      }

      .card {
        padding: 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">PeakFlow<span>AI</span></div>
      <div class="subtitle">Smart appointment automation demo</div>
    </div>

    <div class="card">

      <div id="bookingForm">
        <h1>Book an Appointment</h1>

        <p class="description">
          Choose a service and a time that works for you.
        </p>

        <form id="appointmentForm">

          <div class="form-group">
            <label for="name">Your Name</label>
            <input
              type="text"
              id="name"
              placeholder="John Smith"
              required
            >
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="john@example.com"
              required
            >
          </div>

          <div class="form-group">
            <label for="service">Service</label>
            <select id="service" required>
              <option value="">Choose a service</option>
              <option value="Consultation">Consultation</option>
              <option value="Appointment">Appointment</option>
              <option value="Follow-Up">Follow-Up</option>
            </select>
          </div>

          <div class="form-group">
            <label for="date">Preferred Date</label>
            <input
              type="date"
              id="date"
              required
            >
          </div>

          <div class="form-group">
            <label for="time">Preferred Time</label>
            <select id="time" required>
              <option value="">Choose a time</option>
              <option value="9:00 AM">9:00 AM</option>
              <option value="10:00 AM">10:00 AM</option>
              <option value="11:00 AM">11:00 AM</option>
              <option value="1:00 PM">1:00 PM</option>
              <option value="2:00 PM">2:00 PM</option>
              <option value="3:00 PM">3:00 PM</option>
              <option value="4:00 PM">4:00 PM</option>
            </select>
          </div>

          <button type="submit">
            Book Appointment
          </button>

        </form>
      </div>

      <div id="confirmation" class="confirmation">

        <div class="confirmation-icon">✅</div>

        <h2>Appointment Request Received!</h2>

        <p>
          Thanks! Your appointment request has been received.
          This is a demo of the PeakFlow AI booking experience.
        </p>

      </div>

    </div>

  </div>

  <script>
    document
      .getElementById("appointmentForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        document.getElementById("bookingForm").style.display = "none";
        document.getElementById("confirmation").style.display = "block";

      });
  </script>

</body>
</html>
